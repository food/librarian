[project]
name = "librarian"
version = "0.1.0"
description = "Local-first AI memory: OKF markdown bundle + librarian agent, exposed via MCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.9,<3",
    "openai>=1.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "Markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
librarian = ["webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
